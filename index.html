<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002B49">
<title>Bitácora Vehicular · Saint Luke's Hospitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&display=swap" rel="stylesheet">
<style>
/* Paleta y tipografía alineadas con CCE 2.0 · Saint Luke's Hospitals */
:root{
  --navy:#002B49; --navy2:#0E3A5C; --navy3:#004B87; --sky:#0072CE; --skySoft:#E6F1FB;
  --gold:#C5A059; --gold2:#8A6A2E; --goldSoft:#F6EEDC;
  --bg:#F4F7FA; --card:#fff; --ink:#1B2B3A; --muted:#5B6B7B; --faint:#8A99A8; --line:#D5DEE6; --line2:#E7EDF2;
  --ok:#1F7A4D; --okBg:#E3F2EA; --warn:#9A6300; --warnBg:#FCF1DC; --bad:#B42318; --badBg:#FDECEA;
  --r-sm:6px; --rr:10px; --r:16px; --shadow:0 1px 2px rgba(0,43,73,.06),0 8px 24px rgba(0,43,73,.06);
  --serif:'Source Serif 4',Georgia,serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}

/* ---------- Barra superior (igual que CCE) ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;height:68px;display:flex;align-items:center;gap:.85rem;padding:0 20px}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:40px;width:auto;display:block}
.hsep{width:1px;height:34px;background:var(--line);flex:none}
.htitle{line-height:1.25;flex:1;min-width:0}
.htitle b{display:block;color:var(--navy);font-size:.95rem;font-weight:700}
.htitle span{color:var(--muted);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1px solid var(--line);color:var(--navy);border-radius:var(--rr);padding:.45rem .85rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:border-color .15s}
.hbtn:hover{border-color:var(--navy)}
@media(max-width:430px){.brand img{height:32px}.hwrap{gap:.6rem;padding:0 14px;height:62px}.hsep{height:28px}.htitle b{font-size:.88rem}}

/* ---------- Contenido ---------- */
main{max-width:560px;width:100%;margin:0 auto;padding:28px 16px 48px;flex:1}
main.wide{max-width:1180px;padding-left:20px;padding-right:20px}
main>h2:first-child{font-family:var(--serif);font-weight:600;color:var(--navy);font-size:clamp(1.7rem,5vw,2.2rem);letter-spacing:-.01em;margin:0 0 1.2rem;line-height:1.15}
h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin:6px 0 14px;color:var(--navy);line-height:1.2}
h3{font-size:1.02rem;margin:0 0 .9rem;color:var(--navy);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:1.4rem;margin-bottom:16px;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:.92rem}
.small{font-size:.85rem}

/* ---------- Campos ---------- */
label.lbl{display:block;font-weight:600;font-size:.9rem;margin:1.15rem 0 .45rem;color:var(--navy)}
label.lbl:first-child{margin-top:0}
.req::after{content:" *";color:var(--bad)}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--rr);padding:.78rem .9rem;background:#fff;font-size:1rem;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,114,206,.18)}
textarea{resize:vertical;min-height:72px}
.kminput{font-size:1.75rem;font-weight:700;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums;color:var(--navy)}

.btn{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;border:1px solid transparent;border-radius:var(--rr);padding:.95rem 1.15rem;font-weight:600;font-size:1rem;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--navy3);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover:not(:disabled){background:#b48f4b}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--navy)}
.btn-ghost:hover:not(:disabled){border-color:var(--navy)}
.btn-danger{background:transparent;border-color:#f1b8b2;color:var(--bad)}
.row{display:flex;gap:10px}
.row>*{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer;font-weight:600;color:var(--muted);transition:.15s}
.chip:hover{color:var(--navy);border-color:var(--faint)}
.chip.on{background:var(--skySoft);border-color:var(--navy3);color:var(--navy3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:var(--rr);padding:.7rem .4rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on[data-v=Bajo]{background:var(--okBg);border-color:var(--ok);color:var(--ok)}
.seg button.on[data-v=Medio]{background:var(--warnBg);border-color:var(--warn);color:var(--warn)}
.seg button.on[data-v=Alto]{background:var(--badBg);border-color:var(--bad);color:var(--bad)}

.vlist{display:grid;gap:10px}
.vopt{display:flex;align-items:center;gap:.9rem;border:1px solid var(--line);border-radius:var(--rr);padding:.85rem .95rem;cursor:pointer;background:#fff;text-align:left;width:100%;transition:.15s}
.vopt:hover:not([disabled]){border-color:var(--faint)}
.vopt.on{border-color:var(--navy3);background:var(--skySoft);box-shadow:0 0 0 1px var(--navy3) inset}
.vopt[disabled]{opacity:.5;cursor:not-allowed}
.vicon{width:42px;height:42px;border-radius:var(--rr);background:var(--skySoft);color:var(--navy3);display:grid;place-items:center;flex:none}
.vopt.on .vicon{background:var(--navy3);color:#fff}
.vopt b{display:block;color:var(--navy)}
.vopt .muted{font-size:.82rem}

.gauge{display:flex;flex-direction:column;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:14px 12px 10px}
.gauge svg{width:220px;max-width:100%}
.gauge .val{font-family:var(--serif);font-weight:600;font-size:1.4rem;color:var(--navy);margin-top:-6px}
.fuelbtns{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:100%;margin-top:12px}
.fuelbtns button{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:9px 0;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.fuelbtns button.on{background:var(--navy3);color:#fff;border-color:var(--navy3)}

.car{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.zone{border:1px solid var(--line);background:#fff;border-radius:var(--rr);padding:.8rem .5rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--navy);transition:.15s}
.zone svg{width:56px;height:30px}
.zone.on{border-color:var(--bad);background:var(--badBg);color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.92rem;cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--navy3)}

.photo{border:1.5px dashed var(--line);border-radius:var(--rr);padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:.9rem;background:var(--bg);transition:.15s}
.photo:hover{border-color:var(--sky);background:var(--skySoft)}
.photo img{max-width:100%;max-height:180px;border-radius:8px;display:block;margin:0 auto 8px}

/* ---------- Servicio en curso (estilo tarjeta "record" de CCE) ---------- */
.active{position:relative;overflow:hidden;background:var(--navy);color:#fff;border:none}
.active::after{content:"";position:absolute;right:-150px;top:-150px;width:340px;height:340px;border-radius:50%;border:42px solid rgba(0,114,206,.28);pointer-events:none}
.active>*{position:relative;z-index:1}
.active h3{color:#B9D0E3;font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.active .muted{color:#B9D0E3}
.timer{font-family:var(--serif);font-size:3rem;font-weight:600;line-height:1;margin:.2rem 0 .35rem;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px;margin:1.2rem 0;background:rgba(255,255,255,.14);border-radius:var(--rr);overflow:hidden;font-size:.92rem}
.kv dt,.kv dd{background:var(--navy2);margin:0;padding:.6rem .9rem}
.kv dt{color:#B9D0E3}
.kv dd{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .65rem;font-size:.75rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--okBg);color:var(--ok)}
.p-open{background:var(--skySoft);color:var(--navy3)}
.p-bad{background:var(--badBg);color:var(--bad)}
.p-warn{background:var(--warnBg);color:var(--warn)}

.hist{display:grid}
.hitem{display:flex;gap:14px;padding:.85rem 0;border-top:1px solid var(--line2);align-items:center}
.hitem:first-child{border-top:none}
.hitem .d{font-size:.78rem;color:var(--muted);width:58px;flex:none;line-height:1.35;font-variant-numeric:tabular-nums}
.hitem .t{flex:1;min-width:0}
.hitem .t b{font-size:.92rem;display:block;color:var(--navy)}
.hitem .t span{font-size:.85rem;color:var(--muted)}
.hitem .k{font-weight:700;font-size:.92rem;color:var(--navy);white-space:nowrap}

/* ---------- Acceso ---------- */
.welcome{display:flex;align-items:center;gap:.9rem;margin-bottom:1.2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--line2)}
.welcome b{display:block;color:var(--navy)}
.pinbox{display:flex;justify-content:center;gap:12px;margin:8px 0 18px}
.pinbox i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block;transition:.15s}
.pinbox i.f{background:var(--navy3);border-color:var(--navy3)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{padding:15px 0;border-radius:var(--rr);border:1px solid var(--line);background:#fff;font-size:1.35rem;font-weight:500;cursor:pointer;color:var(--navy);font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--skySoft);border-color:var(--sky)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:.85rem 1.1rem;border-radius:var(--rr);font-size:.92rem;opacity:0;transition:.25s;z-index:100;max-width:92%;box-shadow:0 12px 30px rgba(0,43,73,.3);border-left:4px solid var(--gold)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-left-color:#F97066}
.loader{position:fixed;inset:0;background:rgba(0,43,73,.3);display:grid;place-items:center;z-index:90}
.spin{width:44px;height:44px;border:3px solid rgba(255,255,255,.35);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.alertbox{background:var(--warnBg);color:var(--warn);border-radius:var(--rr);padding:.8rem 1rem;font-size:.92rem;margin-top:10px}
.okbig{text-align:center;padding:2rem 1rem}
.okbig .ic{width:72px;height:72px;border-radius:50%;background:var(--okBg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.foot{text-align:center;margin-top:22px}
.foot a{color:var(--navy3);font-size:.88rem;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- Panel administrativo ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.filters label{font-size:.85rem;font-weight:600;color:var(--navy);display:block;margin-bottom:.4rem}
.filters input,.filters select{padding:0 .75rem;height:44px}
.filters .btn{height:44px}
.filters .btn{padding:.65rem;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kpi{background:#fff;padding:1rem 1.2rem}
.kpi span{font-size:.82rem;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--serif);font-size:2.1rem;color:var(--navy);font-weight:600;line-height:1.1;margin-top:.25rem;font-variant-numeric:tabular-nums}
.modal .kpis{margin:12px 0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-left:4px solid var(--sky);border-radius:var(--rr);padding:.9rem 1rem;background:#fff}
.vcard b{color:var(--navy)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rr)}
table{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff}
th{background:var(--bg);color:var(--muted);text-align:left;padding:.75rem .7rem;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;position:sticky;top:0;border-bottom:1px solid var(--line)}
td{padding:.75rem .7rem;border-bottom:1px solid var(--line2);vertical-align:top}
td:first-child,td:nth-child(2){white-space:nowrap}
td:nth-child(5){min-width:200px}
tbody tr:hover td{background:#F8FAFC}
tr.alert td{background:#FFFBF2!important}
tr.alert td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
td a{color:var(--navy3);font-weight:600}
.mini{padding:.35rem .7rem;font-size:.8rem;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--navy)}
.mini:hover{border-color:var(--navy)}

.modal{position:fixed;inset:0;background:rgba(0,43,73,.5);display:grid;place-items:center;z-index:80;padding:16px}
.modal .card{width:100%;max-width:440px;margin:0;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .card.wide{max-width:1000px;max-height:94vh;overflow:auto}

.map{height:380px;border-radius:var(--rr);border:1px solid var(--line);position:relative;z-index:0;background:#E8EEF3}
.mk{background:var(--navy);color:#fff;border:2px solid #fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block;transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(0,43,73,.35);text-align:center;line-height:1.25;font-family:var(--sans)}
.mk b{display:block;color:var(--gold)}
.mk.over{background:var(--bad)}.mk.over b{color:#fff}
.mk.off{background:var(--faint)}.mk.off b{color:#fff}
.gpsline{display:flex;align-items:center;gap:9px;background:var(--navy2);border-radius:var(--rr);padding:.65rem .85rem;font-size:.85rem;margin:0 0 10px}
.gpsline .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.gpsline .dot.on{background:#4ADE80;animation:pulse 1.6s infinite}
.gpsline .dot.err{background:#F97066}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.legend{display:flex;gap:.4rem 1.1rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* ---------- Pie ---------- */
.sitefoot{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:.85rem;margin-top:auto}
.sitefoot .fw{max-width:1180px;margin:0 auto;padding:1.5rem 20px;display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;justify-content:space-between;align-items:center}
.sitefoot .tag{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--navy);display:flex;align-items:center;gap:8px}
.sitefoot .tag svg{color:var(--sky)}
.sitefoot .sedes{line-height:1.6}
.sitefoot .sedes b{color:var(--navy);font-weight:600}
.demo{background:var(--goldSoft);color:var(--gold2);text-align:center;font-size:12px;font-weight:700;padding:6px;border-bottom:1px solid #E9DBB8}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtKm = n => (Number(n)||0).toLocaleString('es-MX');
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',3800); }
function loading(on){ $('#loader').classList.toggle('hidden',!on); }

async function api(action, payload={}, silent){
  if(!silent) loading(true);
  try{
    const body = Object.assign({action}, payload);
    const res = API_URL ? await (await fetch(API_URL,{method:'POST',body:JSON.stringify(body)})).json() : await MOCK(body);
    if(!res.ok){
      if(res.error==='SESION_EXPIRADA'){ if(!silent){ toast('Tu sesión expiró, vuelve a entrar',true); logout(true); } throw new Error('silent'); }
      throw new Error(res.error||'Error');
    }
    return res.data;
  } catch(e){
    if(!silent && e.message!=='silent') toast(e.message==='Failed to fetch'?'Sin conexión. Revisa tu internet e intenta de nuevo.':e.message,true);
    throw e;
  } finally { if(!silent) loading(false); }
}

async function boot(){
  if(!API_URL) $('#demoBar').classList.remove('hidden');
  if(location.hash==='#admin'){ return adminStart(); }
  const saved = store.get('bv_sess');
  try{
    const ini = await api('init'); S.choferes=ini.choferes; S.kmMax=ini.kmMax; S.velMax=ini.velMax||90; S.gpsObligatorio=ini.gpsObligatorio!==false;
  }catch(e){ return renderError(); }
  if(saved && saved.token){
    S.token = saved.token;
    try{ applyEstado(await api('estado',{token:S.token})); return renderHome(); }catch(e){ S.token=null; }
  }
  renderLogin();
}
function renderError(){
  $('#main').innerHTML=`<div class="card" style="text-align:center"><h2>No fue posible conectar</h2><p class="muted">Revisa tu conexión a internet.</p><button class="btn btn-primary" onclick="location.reload()">Reintentar</button></div>`;
}
function applyEstado(d){ S.chofer=d.chofer; S.abierto=d.abierto; S.vehiculos=d.vehiculos; S.historial=d.historial; }
function logout(silent){
  if(!silent && S.abierto && !confirm('Tienes un servicio abierto. Podrás finalizarlo al volver a entrar. ¿Salir?')) return;
  gpsFlush(); gpsStop(); clearInterval(VIVO.int);
  store.del('bv_sess'); store.del('bv_admin'); S.token=null; S.chofer=null; S.admin=null; clearInterval(timerInt);
  $('#btnSalir').classList.add('hidden'); $('#main').classList.remove('wide');
  if(location.hash==='#admin'){ history.replaceState(null,'',location.pathname); }
  boot();
}

function dispositivo(){

  const nav=/edg\//i.test(u)?'Edge':/samsungbrowser/i.test(u)?'Samsung Internet':/crios|chrome/i.test(u)?'Chrome':/fxios|firefox/i.test(u)?'Firefox':/safari/i.test(u)?'Safari':'Navegador';

function drawPin(){ const n=Math.max(4,pin.length); $('#pinDots').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<pin.length?'f':''}"></i>`).join(''); }
async function pinKey(k){
  if(k==='C'){ pin=pin.slice(0,-1); return drawPin(); }
  if(k==='OK'){
    const id=$('#selChofer').value;
    if(!id) return toast('Selecciona tu nombre',true);
    if(pin.length<4) return toast('El PIN tiene al menos 4 dígitos',true);
    let ubicacion=null;
    loading(true); try{ ubicacion=await getPos(6000); }catch(e){} finally{ loading(false); }
    try{
      const d = await api('login',{choferId:id,pin,dispositivo:dispositivo(),ubicacion});
      S.token=d.token; applyEstado(d); store.set('bv_sess',{token:d.token}); store.set('bv_lastChofer',id);
      renderHome();
    }catch(e){ pin=''; drawPin(); }
    return;
  }
  if(pin.length<8){ pin+=k; drawPin(); }
}

function gaugeHTML(key){

      ${Array.from({length:9},(_,i)=>{const a=Math.PI-(i*Math.PI/8);const x1=110+72*Math.cos(a),y1=112-72*Math.sin(a),x2=110+62*Math.cos(a),y2=112-62*Math.sin(a);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#002B49" stroke-width="${i%2?1.5:3}"/>`}).join('')}
      <text x="12" y="124" font-size="15" font-weight="800" fill="#B42318">E</text>
      <text x="198" y="124" font-size="15" font-weight="800" fill="#1F7A4D">F</text>
      <line id="gneedle_${key}" x1="110" y1="112" x2="110" y2="40" stroke="#002B49" stroke-width="4" stroke-linecap="round" style="transition:transform .25s;transform-origin:110px 112px"/>
      <circle cx="110" cy="112" r="8" fill="#002B49"/><circle cx="110" cy="112" r="3" fill="#C5A059"/>
    </svg>
    <div class="val" id="gval_${key}">Selecciona el nivel</div>
    <div class="fuelbtns">${FUEL.map((f,i)=>`<button type="button" data-i="${i}" onclick="setFuel('${key}',${i})">${i===0?'E':i===8?'F':f}</button>`).join('')}</div>
  </div>`;
}
function setFuel(key,i){
  F[key]=i;
  $('#gneedle_'+key).style.transform=`rotate(${-90+i*22.5}deg)`;
  $('#gval_'+key).textContent=FUEL[i];
  document.querySelectorAll(`#g_${key} ~ .fuelbtns button`).forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  const end=Math.PI-(i*Math.PI/8);
  $('#garc_'+key).setAttribute('d', i===0?'':`M20 112 A90 90 0 0 1 ${110+90*Math.cos(end)} ${112-90*Math.sin(end)}`);
}
function inspHTML(key){
  return `<div class="car">${ZONAS.map(z=>`<button type="button" class="zone" data-z="${esc(z.id)}" onclick="this.classList.toggle('on')">${z.ic}${esc(z.id)}</button>`).join('')}</div>
    <label class="toggle"><input type="checkbox" id="limp_${key}"> Limpieza deficiente</label>
    <textarea id="inspnota_${key}" placeholder="Describe el daño, golpe o detalle (opcional)" style="margin-top:10px;min-height:56px"></textarea>`;
}
function readInsp(key){
  return { zonas:[...document.querySelectorAll(`#insp_${key} .zone.on`)].map(b=>b.dataset.z), limpieza:$('#limp_'+key).checked, nota:$('#inspnota_'+key).value.trim() };
}
function photoHTML(key){
  return `<div class="photo" id="ph_${key}" onclick="pickPhoto('${key}')">📷 Tomar foto del tablero (odómetro y combustible)<br><span class="small">Opcional · recomendado</span></div>`;
}
function pickPhoto(key){
  const inp=$('#fileCam'); inp.value='';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      F['foto_'+key]=await compress(f);
      $('#ph_'+key).innerHTML=`<img src="${F['foto_'+key]}"><span class="small">Toca para cambiar la foto</span>`;
    }catch(e){ toast('No se pudo procesar la foto',true); }
  };
  inp.click();
}
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1280, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
    img.onerror=rej; img.src=url;
  });
}

function selVeh(id){
  F.vehiculoId=id; const v=S.vehiculos.find(x=>x.id===id);
  document.querySelectorAll('.vopt').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  $('#kmHint').textContent=`Último kilometraje registrado: ${fmtKm(v.km)} km`;
  $('#kmIni').value=v.km||''; checkGap();
}
function checkGap(){
  const v=S.vehiculos.find(x=>x.id===F.vehiculoId); const km=+$('#kmIni').value;
  $('#kmGap').innerHTML = v && v.km && km>v.km ? `<div class="alertbox">⚠️ Hay <b>${fmtKm(km-v.km)} km</b> de diferencia con el último registro. Se reportará como kilometraje sin registrar. Explica el motivo en Notas.</div>`
    : v && km && km<v.km ? `<div class="alertbox" style="background:var(--badBg);color:var(--bad);border-color:#F2C4C4">El kilometraje no puede ser menor a ${fmtKm(v.km)} km.</div>` : '';
}
function selTipo(el,t){ F.tipo=t; document.querySelectorAll('#chipsTipo .chip').forEach(c=>c.classList.toggle('on',c===el)); }
function selPrio(p){ F.prioridad=p; document.querySelectorAll('#segPrio button').forEach(b=>b.classList.toggle('on',b.dataset.v===p)); }

async function submitInicio(){
  const detalle=$('#detalle').value.trim(), km=+$('#kmIni').value, v=S.vehiculos.find(x=>x.id===F.vehiculoId);
  if(!v) return toast('Selecciona el vehículo',true);
  if(!F.tipo) return toast('Selecciona el tipo de servicio',true);
  if(!detalle) return toast('Especifica el destino o detalle',true);
  if(!F.prioridad) return toast('Selecciona la prioridad',true);
  if(!km) return toast('Captura el kilometraje de salida',true);
  if(km<v.km) return toast(`El kilometraje no puede ser menor a ${fmtKm(v.km)}`,true);
  if(F.combIni===undefined) return toast('Indica el nivel de combustible',true);
  const notas=$('#notasIni').value.trim();
  if(v.km && km>v.km && !notas) return toast('Explica en Notas la diferencia de kilometraje',true);
  let ubicacion=null;
  loading(true); try{ ubicacion=await getPos(15000); }catch(e){} finally{ loading(false); }
  if(!ubicacion && S.gpsObligatorio) return gpsAyuda(submitInicio);
  try{
    const r=await api('iniciar',{token:S.token,vehiculoId:v.id,tipo:F.tipo,detalle,prioridad:F.prioridad,km,combustible:F.combIni,inspeccion:readInsp('ini'),notas,foto:F.foto_ini||'',ubicacion});
    applyEstado(await api('estado',{token:S.token}));
    done('Salida registrada',`Folio <b>${esc(r.folio)}</b> · ${esc(r.hora)}`);
  }catch(e){ if(/en uso|abierto/i.test(e.message)) { try{applyEstado(await api('estado',{token:S.token}));}catch(_){} } }
}

/* ============ GPS (chofer) ============ */
const GPS={watch:null,folio:null,q:[],last:null,sending:false,timer:null,wake:null,err:null,acc:null,spd:null,lastOk:0,hiddenAt:0};
function hav(a,b){ const R=6371000,rad=x=>x*Math.PI/180,dLa=rad(b.lat-a.lat),dLo=rad(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function getPos(timeout){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('Este celular no tiene GPS disponible'));
    navigator.geolocation.getCurrentPosition(p=>res({t:p.timestamp||Date.now(),lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),
      spd:p.coords.speed!=null&&p.coords.speed>=0?Math.round(p.coords.speed*3.6):'',hdg:''}), rej, {enableHighAccuracy:true,timeout,maximumAge:10000});
  });
}
function gpsStart(folio){
  if(GPS.watch!==null && GPS.folio===folio) return;
  gpsStop();
  GPS.folio=folio; GPS.q=store.get('bv_gpsq_'+folio)||[]; GPS.err=null; GPS.last=null;
  if(!navigator.geolocation){ GPS.err='Sin GPS'; return gpsUI(); }
  GPS.watch=navigator.geolocation.watchPosition(onPos,e=>{ GPS.err=e.code===1?'Permiso de ubicación denegado':'Buscando señal GPS…'; gpsUI(); },
    {enableHighAccuracy:true,maximumAge:3000,timeout:30000});
  GPS.timer=setInterval(gpsFlush,30000);
  wakeOn();
}
function onPos(p){
  const c=p.coords, t=p.timestamp||Date.now();
  if(c.accuracy>100){ GPS.err='Señal GPS débil (±'+Math.round(c.accuracy)+' m)'; return gpsUI(); }
  GPS.err=null; GPS.acc=Math.round(c.accuracy);
  const pt={t,lat:+c.latitude.toFixed(6),lng:+c.longitude.toFixed(6),acc:GPS.acc,spd:'',hdg:c.heading!=null&&!isNaN(c.heading)?Math.round(c.heading):''};
  let spd=c.speed!=null&&c.speed>=0?c.speed*3.6:null;
  if(GPS.last){
    const d=hav(GPS.last,pt), dt=(t-GPS.last.t)/1000;
    if(spd===null && dt>=2) spd=d/dt*3.6;
    if(spd!==null && spd>200) spd=null;            // salto de señal, no es velocidad real
    GPS.spd=spd===null?GPS.spd:Math.round(spd);
    if(dt<10 && d<25) return gpsUI();          // no saturar: 1 punto cada 10 s o 25 m
  } else GPS.spd=spd===null?0:Math.round(spd);
  pt.spd=spd===null?'':Math.round(spd);
  GPS.last=pt; GPS.q.push(pt);
  if(GPS.q.length>3000) GPS.q=GPS.q.slice(-3000);
  store.set('bv_gpsq_'+GPS.folio,GPS.q);
  gpsUI();
}
async function gpsFlush(){
  if(GPS.sending || !GPS.folio || !GPS.q.length || !S.token) return;
  GPS.sending=true;
  const lote=GPS.q.slice(0,300), folio=GPS.folio;
  try{
    await api('gps',{token:S.token,folio,puntos:lote},true);
    GPS.q=GPS.q.slice(lote.length); GPS.lastOk=Date.now();
    store.set('bv_gpsq_'+folio,GPS.q);
    if(GPS.q.length) setTimeout(gpsFlush,500);
  }catch(e){} finally{ GPS.sending=false; gpsUI(); }
}
function gpsStop(){
  if(GPS.watch!==null) navigator.geolocation.clearWatch(GPS.watch);
  clearInterval(GPS.timer); GPS.watch=null; GPS.timer=null;
  if(GPS.folio && !GPS.q.length) store.del('bv_gpsq_'+GPS.folio);
  GPS.folio=null; wakeOff();
}
async function wakeOn(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible') GPS.wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function wakeOff(){ try{ GPS.wake&&GPS.wake.release(); }catch(e){} GPS.wake=null; }
document.addEventListener('visibilitychange',()=>{
  if(!GPS.folio) return;
  if(document.visibilityState==='hidden'){ GPS.hiddenAt=Date.now(); gpsFlush(); }
  else { wakeOn(); gpsFlush(); if(GPS.hiddenAt && Date.now()-GPS.hiddenAt>60000) toast('El rastreo se pausa si cierras la app o apagas la pantalla. Déjala abierta durante el servicio.',true); GPS.hiddenAt=0; }
});
function gpsUI(){
  const el=$('#gpsInfo'); if(!el) return;
  const pend=GPS.q.length;
  if(GPS.err) el.innerHTML=`<span class="dot err"></span><span>${esc(GPS.err)}</span>`;
  else if(GPS.acc===null) el.innerHTML='<span class="dot"></span><span>Activando GPS…</span>';
  else el.innerHTML=`<span class="dot on"></span><span><b>GPS activo</b> · ±${GPS.acc} m · ${GPS.spd||0} km/h${pend>3?` · ${pend} por enviar`:''}</span>`;
}

  let map=null;
  m.querySelector('#rClose').onclick=()=>{ try{map&&map.remove();}catch(e){} m.remove(); };
  try{ await loadLeaflet(); }catch(e){ $('#mapRuta').innerHTML='<p class="muted" style="padding:16px">No se pudo cargar el mapa.</p>'; return; }
  map=baseMap($('#mapRuta'));
  if(!P.length){ $('#mapRuta').insertAdjacentHTML('beforeend','<div style="position:absolute;top:10px;left:50px;z-index:500;background:#fff;padding:8px 12px;border-radius:8px;font-size:13px">Este servicio no tiene puntos GPS registrados</div>'); return; }
  const color=v=>v===''||v==null?'#004B87':v>d.velMax?'#B42318':v>60?'#C5A059':'#1F7A4D';
  let tramo=[[P[0].lat,P[0].lng]], col=color(P[0].spd);
  for(let i=1;i<P.length;i++){
    const c=color(P[i].spd); tramo.push([P[i].lat,P[i].lng]);
    if(c!==col || i===P.length-1){ L.polyline(tramo,{color:col,weight:5,opacity:.9}).addTo(map); tramo=[[P[i].lat,P[i].lng]]; col=c; }
  }
  const hm=t=>new Date(t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  P.filter(p=>p.spd!==''&&p.spd>d.velMax).forEach(p=>L.circleMarker([p.lat,p.lng],{radius:6,color:'#fff',weight:2,fillColor:'#B42318',fillOpacity:1}).bindPopup(`<b>${p.spd} km/h</b><br>${hm(p.t)}`).addTo(map));
  const a=P[0], z=P[P.length-1];
  L.circleMarker([a.lat,a.lng],{radius:9,color:'#fff',weight:3,fillColor:'#1F7A4D',fillOpacity:1}).bindPopup('Salida · '+hm(a.t)).addTo(map);
  L.circleMarker([z.lat,z.lng],{radius:9,color:'#fff',weight:3,fillColor:d.estado==='ABIERTO'?'#C5A059':'#002B49',fillOpacity:1}).bindPopup((d.estado==='ABIERTO'?'Última posición · ':'Regreso · ')+hm(z.t)).addTo(map);
  map.fitBounds(L.latLngBounds(P.map(p=>[p.lat,p.lng])).pad(0.15));
}
function prioPill(p){ return `<span class="pill ${p==='Alto'?'p-bad':p==='Medio'?'p-warn':'p-ok'}">${esc(p)}</span>`; }
function forzarCierre(folio){
  const r=AD.d.registros.find(x=>x.folio===folio);
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card"><h3>Cerrar servicio ${esc(folio)}</h3><p class="muted small">${esc(r.chofer)} · ${esc(r.modelo)} ${esc(r.placa)} · salida ${fmtKm(r.kmSalida)} km</p>
    <label class="lbl req">Km de regreso</label><input type="number" id="mKm" class="kminput" value="${r.kmSalida}">
    <label class="lbl req">Combustible</label><select id="mComb">${FUEL.map((f,i)=>`<option value="${i}">${f}</option>`).join('')}</select>
    <label class="lbl req">Motivo del cierre</label><textarea id="mNota" placeholder="Ej. El chofer olvidó cerrar el servicio"></textarea>
    <div class="row" style="margin-top:14px"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mOk">Cerrar servicio</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mCancel').onclick=()=>m.remove();
  m.querySelector('#mOk').onclick=async()=>{
    const nota=m.querySelector('#mNota').value.trim(); if(!nota) return toast('Indica el motivo',true);
    try{ await api('adminCerrar',{token:S.admin,folio,km:+m.querySelector('#mKm').value,combustible:+m.querySelector('#mComb').value,notas:'[Cierre administrativo] '+nota}); m.remove(); toast('Servicio cerrado'); adminLoad(); }catch(e){}
  };
}
function exportCSV(){
  const R=AD.d.registros;
  const cols=[['folio','Folio'],['fecha','Fecha'],['chofer','Chofer'],['modelo','Modelo'],['placa','Placa'],['sede','Sede'],['tipo','Tipo de servicio'],['detalle','Destino / detalle'],['prioridad','Prioridad'],['horaSalida','Hora salida'],['combSalida','Combustible salida'],['kmSalida','Km salida'],['inspSalida','Inspección salida'],['notasSalida','Notas salida'],['horaRegreso','Hora regreso'],['combRegreso','Combustible regreso'],['kmRegreso','Km regreso'],['kmRecorridos','Km recorridos'],['duracion','Duración (min)'],['incidencias','Incidencias regreso'],['notasRegreso','Notas regreso'],['estado','Estado'],['alertas','Alertas']];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='﻿'+cols.map(c=>q(c[1])).join(',')+'\n'+R.map(r=>cols.map(c=>q(r[c[0]])).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`bitacora_vehicular_${AD.f.desde}_${AD.f.hasta}.csv`; a.click();
}

/* ============ MODO DEMO (solo si API_URL está vacío) ============ */
const DB = {
  choferes:[{id:'CH-001',nombre:'Luis',pin:'1234',sede:'San José del Cabo'},{id:'CH-002',nombre:'Carlos',pin:'2345',sede:'San José del Cabo'},{id:'CH-003',nombre:'Jesús',pin:'3456',sede:'San José del Cabo'}],
  veh:[{id:'V-001',placa:'CZ-123-A',modelo:'Kia Forte',sede:'San José del Cabo',km:218911,enUso:'',folio:''},{id:'V-002',placa:'CZ-456-B',modelo:'Nissan Urvan',sede:'Cabo San Lucas',km:95420,enUso:'',folio:''}],
  bit:[], gps:[], sess:{}
};
function MOCK(b){
  return new Promise(res=>setTimeout(()=>{ try{ res({ok:true,data:mockRun(b)}); }catch(e){ res({ok:false,error:e.message}); } },250));
}
function mockRun(b){
  const now=new Date(), pad=n=>String(n).padStart(2,'0'), hora=d=>d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'';
  const ses=()=>{ const s=DB.sess[b.token]; if(!s) throw new Error('SESION_EXPIRADA'); return s; };
  const ab=id=>{ const r=DB.bit.find(x=>x.choferId===id&&x.estado==='ABIERTO'); return r?{folio:r.folio,placa:r.placa,modelo:r.modelo,tipo:r.tipo,detalle:r.detalle,prioridad:r.prioridad,kmSalida:r.kmSalida,combSalida:r.combSalida,horaSalida:hora(r._s),salidaISO:r._s.toISOString()}:null; };
  const est=id=>{ const c=DB.choferes.find(x=>x.id===id); return {chofer:{id:c.id,nombre:c.nombre,sede:c.sede},abierto:ab(id),vehiculos:DB.veh.map(v=>({...v})),
    historial:DB.bit.filter(r=>r.choferId===id).slice(-15).reverse().map(r=>({...r,horaSalida:hora(r._s),horaRegreso:hora(r._r),km:r.kmRecorridos}))}; };
  const insp=i=>{ const p=[]; if(i.zonas.length)p.push('Daño/golpe: '+i.zonas.join(', ')); if(i.limpieza)p.push('Limpieza deficiente'); if(i.nota)p.push(i.nota); return p.join(' — ')||'Sin observaciones'; };
  const addPts=(r,pts)=>{ (pts||[]).filter(p=>p&&isFinite(p.lat)).forEach(p=>DB.gps.push({folio:r.folio,...p})); const u=DB.gps.filter(g=>g.folio===r.folio).pop(); const v=DB.veh.find(x=>x.id===r.vehiculoId); if(u&&r.estado==='ABIERTO'){v.lat=u.lat;v.lng=u.lng;v.vel=u.spd;v.rep=u.t;} };
  const ptsDe=f=>DB.gps.filter(g=>g.folio===f).sort((a,b)=>a.t-b.t);
  const stats=(P,vm)=>{ let m=0,mx=0,su=0,n=0,ex=0,ov=false; P.forEach((p,i)=>{ if(i) m+=hav(P[i-1],p); const v=+p.spd||0; mx=Math.max(mx,v); if(v>5){su+=v;n++;} if(v>vm){if(!ov){ex++;ov=true}}else if(v<vm-5)ov=false; }); return {km:Math.round(m/100)/10,vmax:Math.round(mx),vprom:n?Math.round(su/n):'',excesos:ex,puntos:P.length}; };
  const cerrar=(r,by)=>{ if(b.ubicacion) addPts(r,[b.ubicacion]); const st=stats(ptsDe(r.folio),90); Object.assign(r,{kmGps:st.km,velMaxReg:st.vmax,velProm:st.vprom,excesos:st.excesos,puntosGps:st.puntos}); if(st.excesos) r.alertas=[r.alertas,st.excesos+' exceso(s) de velocidad · máx '+st.vmax+' km/h'].filter(Boolean).join(' | '); if(b.km<r.kmSalida) throw new Error('Km menor al de salida'); r._r=now; r.kmRegreso=b.km; r.kmRecorridos=b.km-r.kmSalida; r.combRegreso=FUEL[b.combustible]; r.duracion=Math.round((now-r._s)/60000);
    r.incidencias=b.inspeccion?insp(b.inspeccion):''; r.notasRegreso=b.notas; r.estado='CERRADO'; r.cerradoPor=by; if(r.kmRecorridos>300) r.alertas=[r.alertas,r.kmRecorridos+' km en un solo servicio'].filter(Boolean).join(' | ');
    const v=DB.veh.find(x=>x.id===r.vehiculoId); v.km=b.km; v.enUso=''; v.folio=''; return {folio:r.folio,km:r.kmRecorridos,duracion:r.duracion,hora:hora(now)}; };
  switch(b.action){
    case 'init': return {choferes:DB.choferes.map(({pin,...c})=>c),kmMax:300,velMax:90,gpsObligatorio:true};
    case 'login': { const c=DB.choferes.find(x=>x.id===b.choferId); if(!c||c.pin!==b.pin) throw new Error('PIN incorrecto (demo: Luis 1234, Carlos 2345, Jesús 3456)'); const t='t'+Math.random(); DB.sess[t]={tipo:'chofer',id:c.id}; return {token:t,...est(c.id)}; }
    case 'estado': return est(ses().id);
    case 'iniciar': { const s=ses(), c=DB.choferes.find(x=>x.id===s.id), v=DB.veh.find(x=>x.id===b.vehiculoId);
      if(ab(s.id)) throw new Error('Ya tienes un servicio abierto'); if(v.folio) throw new Error('Vehículo en uso por '+v.enUso); if(b.km<v.km) throw new Error('Km menor al último registrado');
      const folio=`BV-${String(now.getFullYear()).slice(2)}${pad(now.getMonth()+1)}${pad(now.getDate())}-${String(DB.bit.length+1).padStart(4,'0')}`;
      DB.bit.push({folio,fecha:ymd(now),choferId:c.id,chofer:c.nombre,vehiculoId:v.id,placa:v.placa,modelo:v.modelo,sede:v.sede,tipo:b.tipo,detalle:b.detalle,prioridad:b.prioridad,_s:now,
        combSalida:FUEL[b.combustible],kmSalida:b.km,inspSalida:insp(b.inspeccion),notasSalida:b.notas,fotoSalida:'',estado:'ABIERTO',alertas:v.km&&b.km>v.km?(b.km-v.km)+' km sin registrar desde el último servicio':''});
      v.km=b.km; v.enUso=c.nombre; v.folio=folio; if(b.ubicacion) addPts(DB.bit[DB.bit.length-1],[b.ubicacion]); return {folio,hora:hora(now)}; }
    case 'gps': { const s=ses(); const r=DB.bit.find(x=>x.folio===b.folio&&x.choferId===s.id); if(!r) throw new Error('Servicio no encontrado'); addPts(r,b.puntos); return {recibidos:b.puntos.length}; }
    case 'adminVivo': return {velMax:90,ahora:Date.now(),unidades:DB.veh.filter(v=>v.folio).map(v=>{ const r=DB.bit.find(x=>x.folio===v.folio); return {folio:v.folio,placa:v.placa,modelo:v.modelo,chofer:v.enUso,tipo:r.tipo,detalle:r.detalle,salida:hora(r._s),lat:v.lat??null,lng:v.lng??null,vel:v.vel??null,reporte:v.rep??null}; })};
    case 'adminGps': { const r=DB.bit.find(x=>x.folio===b.folio); const P=ptsDe(b.folio); return {folio:r.folio,chofer:r.chofer,placa:r.placa,modelo:r.modelo,tipo:r.tipo,detalle:r.detalle,estado:r.estado,salida:hora(r._s),regreso:hora(r._r),kmOdometro:r.kmRecorridos??'',velMax:90,puntos:P,stats:stats(P,90)}; }
    case 'finalizar': { const s=ses(); const r=DB.bit.find(x=>x.folio===b.folio&&x.choferId===s.id&&x.estado==='ABIERTO'); if(!r) throw new Error('No encontrado'); return cerrar(r,'Chofer'); }
    case 'adminLogin': { if(b.pin!=='000000') throw new Error('PIN incorrecto (demo: 000000)'); const t='a'+Math.random(); DB.sess[t]={tipo:'admin'}; return {token:t}; }
    case 'adminData': { if(ses().tipo!=='admin') throw new Error('Sin permiso');
      return {velMax:90,registros:DB.bit.filter(r=>r.fecha>=b.desde&&r.fecha<=b.hasta&&(!b.vehiculoId||r.vehiculoId===b.vehiculoId)&&(!b.choferId||r.choferId===b.choferId)).map(r=>({...r,horaSalida:hora(r._s),horaRegreso:hora(r._r)})).reverse(),
        vehiculos:DB.veh.map(v=>({...v})),choferes:DB.choferes.map(({pin,...c})=>({...c,activo:true}))}; }
    case 'adminCerrar': { const r=DB.bit.find(x=>x.folio===b.folio&&x.estado==='ABIERTO'); if(!r) throw new Error('Ya no está abierto'); return cerrar(r,'Admin'); }
  }
  throw new Error('Acción no válida');
}
